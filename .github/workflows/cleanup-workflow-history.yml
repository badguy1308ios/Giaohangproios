name: Dọn lịch sử workflow cũ
run-name: "Dọn workflow history • giữ build #71 trở lên"

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    name: Xóa workflow run trước build 71
    runs-on: ubuntu-latest
    steps:
      - name: Delete Build Android APK runs below 71
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | select(.name == "Build Android APK" or (.name | startswith("GiaoHangPro • build #"))) | [.id, .run_number, .name] | @tsv' \
            > /tmp/build-runs.tsv

          while IFS="$(printf '\t')" read -r run_id run_number run_name; do
            [ -z "$run_id" ] && continue
            if [ "$run_number" -lt 71 ] && [ "$run_id" != "$CURRENT_RUN_ID" ]; then
              printf 'DELETE run #%s: %s (id %s)\n' "$run_number" "$run_name" "$run_id"
              gh api --method DELETE "repos/$REPO/actions/runs/$run_id"
            else
              printf 'KEEP run #%s: %s\n' "$run_number" "$run_name"
            fi
          done < /tmp/build-runs.tsv
