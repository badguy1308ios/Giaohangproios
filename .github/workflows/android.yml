    value: String,
    onValueChange: (String) -> Unit,
    onClear: () -> Unit,
    onQrClick: () -> Unit
) {
    OutlinedTextField(
        value = value,
        onValueChange = onValueChange,
        modifier = Modifier.fillMaxWidth().heightIn(min = 52.dp),
        placeholder = { Text("Tìm mã đơn, tên người nhận...", color = TextGray, fontSize = 14.sp, maxLines = 1) },
        leadingIcon = {
            Box(
                Modifier.size(38.dp).clip(RoundedCornerShape(10.dp)).background(Orange).clickable { onQrClick() },
                contentAlignment = Alignment.Center
            ) {
                Icon(Icons.Default.QrCodeScanner, contentDescription = "Quét mã QR", tint = Color.White, modifier = Modifier.size(23.dp))
            }
        },
        trailingIcon = {
            if (value.isNotBlank()) IconButton(onClick = onClear) {
                Icon(Icons.Default.Close, contentDescription = "Xóa tìm kiếm", tint = TextGray, modifier = Modifier.size(20.dp))
            }
        },
        shape = RoundedCornerShape(14.dp),
        singleLine = true,
        colors = OutlinedTextFieldDefaults.colors(
            focusedBorderColor = Orange,
            unfocusedBorderColor = Border,
            focusedContainerColor = Color(0xFFF7F5F2),
            unfocusedContainerColor = Color(0xFFF7F5F2),
            cursorColor = OrangeDark
        )
    )
}

