name: Build Android APK
run-name: "GiaoHangPro • build #${{ github.run_number }} • ${{ github.event_name }}"
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare version
        id: version
        run: |
          VERSION_CODE_OFFSET="$(cat version-code-offset.txt)"
          APP_VERSION_CODE="$((GITHUB_RUN_NUMBER + VERSION_CODE_OFFSET))"
          VERSION="1.0.${APP_VERSION_CODE}"
          APK_NAME="GiaoHangPro-v${VERSION}.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
      - name: Use persistent debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ -f app/keystore/giaohangpro-debug.keystore ]; then
            cp app/keystore/giaohangpro-debug.keystore "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
      - name: Build debug APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace
      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}"
      - name: Keep only 4 previous successful APK artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          # Giữ 4 artifact APK xanh cũ; build hiện tại upload thành công sẽ là APK xanh thứ 5.
          gh api --paginate "repos/$REPO/actions/runs?branch=main&status=success&per_page=100" \
            --jq '.workflow_runs[] | select(.id != ('"$CURRENT_RUN_ID"')) | .id' \
            | head -n 4 > /tmp/keep-runs.txt

          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.id, .workflow_run.id, .name] | @tsv' \
            > /tmp/artifacts.tsv

          while IFS="$(printf '\t')" read -r artifact_id run_id artifact_name; do
            [ -z "$artifact_id" ] && continue
            if grep -Fxq "$run_id" /tmp/keep-runs.txt; then
              echo "Keeping recent successful artifact: $artifact_name (run $run_id)"
            else
              echo "Deleting old artifact: $artifact_name (run $run_id)"
              gh api --method DELETE "repos/$REPO/actions/artifacts/$artifact_id"
            fi
          done < /tmp/artifacts.tsv

      - uses: actions/upload-artifact@v4
        with:
          name: "GiaoHangPro-v${{ steps.version.outputs.version }}"
          path: "dist/${{ steps.version.outputs.apk_name }}"
          if-no-files-found: error
          retention-days: 7
