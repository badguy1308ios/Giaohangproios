name: Build Android APK
run-name: "GiaoHangPro v1.0.${{ github.run_number }} • ${{ github.event_name }}"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "Build v1.0.${{ github.run_number }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply compact map UI update
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/giaohangpro/MainActivity.kt')
          s = p.read_text()

          def rep(old, new, count=1):
              global s
              if old in s:
                  s = s.replace(old, new, count)

          rep('import org.maplibre.android.annotations.MarkerOptions\n', 'import org.maplibre.android.annotations.MarkerOptions\nimport org.maplibre.android.annotations.IconFactory\n')

          rep('.height(76.dp)', '.height(40.dp)')
          rep('.padding(horizontal = 24.dp)', '.padding(horizontal = 14.dp)')
          rep('modifier = Modifier.size(34.dp)', 'modifier = Modifier.size(19.dp)')
          rep('modifier = Modifier.size(42.dp)', 'modifier = Modifier.size(23.dp)')
          rep('Spacer(Modifier.width(10.dp))', 'Spacer(Modifier.width(6.dp))')
          rep('fontSize = 27.sp,', 'fontSize = 17.sp,')

          rep('.heightIn(min = 220.dp, max = 430.dp)', '.heightIn(min = 185.dp, max = 300.dp)')
          rep('.padding(horizontal = 14.dp, vertical = 8.dp)', '.padding(horizontal = 10.dp, vertical = 6.dp)')
          rep('.width(56.dp)\n                    .height(4.dp)', '.width(42.dp)\n                    .height(3.dp)')
          rep('verticalArrangement = Arrangement.spacedBy(7.dp)', 'verticalArrangement = Arrangement.spacedBy(5.dp)')

          rep('.height(86.dp)', '.height(68.dp)')
          rep('.padding(horizontal = 12.dp, vertical = 8.dp)', '.padding(horizontal = 9.dp, vertical = 6.dp)')
          rep('.size(28.dp) // Nút dẫn đường nhỏ gọn.', '.size(24.dp) // Nút dẫn đường nhỏ gọn.')
          rep('modifier = Modifier.size(14.dp) // Mũi tên dẫn đường.', 'modifier = Modifier.size(12.dp) // Mũi tên dẫn đường.')

          rep('val width = (52 * density).toInt()', 'val width = (34 * density).toInt()')
          rep('val height = (64 * density).toInt()', 'val height = (42 * density).toInt()')
          rep('val bodyBottom = (48 * density)', 'val bodyBottom = (32 * density)')
          rep('val radius = (18 * density)', 'val radius = (12 * density)')
          rep('width / 2f - 9 * density', 'width / 2f - 6 * density')
          rep('width / 2f + 9 * density', 'width / 2f + 6 * density')
          rep('paint.textSize = 22 * density', 'paint.textSize = 14 * density')

          old = '''readyMap.addMarker(
                    MarkerOptions().position(LatLng(markerData.point.latitude, markerData.point.longitude))
                        .title("Đơn #${markerData.number} • ${order.code}")
                        .snippet(if (markerData.hasRealCoordinate) order.address else "Chưa có tọa độ giao hàng")
                )'''
          new = '''val numberDrawable = createNumberBubbleDrawable(
                    context = context,
                    number = markerData.number,
                    isPending = !markerData.hasRealCoordinate
                )
                val numberBitmap = (numberDrawable as android.graphics.drawable.BitmapDrawable).bitmap
                val numberIcon = IconFactory.getInstance(context).fromBitmap(numberBitmap)
                readyMap.addMarker(
                    MarkerOptions().position(LatLng(markerData.point.latitude, markerData.point.longitude))
                        .icon(numberIcon)
                        .title("Đơn #${markerData.number} • ${order.code}")
                        .snippet(if (markerData.hasRealCoordinate) order.address else "Chưa có tọa độ giao hàng")
                )'''
          rep(old, new)

          rep('NavigationBar(\n        containerColor = Orange,', 'NavigationBar(\n        modifier = Modifier.height(48.dp),\n        containerColor = Orange,')
          rep('modifier = Modifier.size(30.dp)\n            )\n        },\n        label = {\n            Text(label, fontWeight = if (selected) FontWeight.Bold else FontWeight.Normal)', 'modifier = Modifier.size(20.dp)\n            )\n        },\n        label = {\n            Text(label, fontSize = 10.sp, fontWeight = if (selected) FontWeight.Bold else FontWeight.Normal)')
          rep('.size(30.dp) // Bong bóng STT 30dp.', '.size(24.dp) // Bong bóng STT nhỏ gọn 24dp.')
          rep('fontSize = 15.sp, // Số STT 15sp.', 'fontSize = 12.sp, // Số STT 12sp.')

          p.write_text(s)
          PY

      - name: Commit UI source update
        shell: bash
        run: |
          if git diff --quiet; then
            echo "UI source already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/example/giaohangpro/MainActivity.kt
            git commit -m "Compact map UI and number order markers"
            git push origin HEAD:main
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare version
        id: version
        shell: bash
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          APK_NAME="GiaoHangPro-v${VERSION}.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: "GiaoHangPro-v${{ steps.version.outputs.version }}"
          path: "dist/${{ steps.version.outputs.apk_name }}"
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "## GiaoHangPro v${APP_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: #${GITHUB_RUN_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: \`${APK_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- UI: compact header + compact bottom tabs + 3-order scroll + numbered map markers" >> "$GITHUB_STEP_SUMMARY"
