name: Build Android APK From ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Lấy repository
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Cài Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Cài Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # 4. Tìm file ZIP
      - name: Find ZIP file
        shell: bash
        run: |
          echo "📦 Các file trong repository:"
          find . -maxdepth 3 -type f | sort

          ZIP_FILE=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ Không tìm thấy file ZIP"
            exit 1
          fi

          echo "✅ ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # 5. Giải nén source Android
      - name: Extract Android source
        shell: bash
        run: |
          rm -rf android_source
          mkdir -p android_source

          unzip -q "$ZIP_FILE" -d android_source

          echo "📂 Source sau khi giải nén:"
          find android_source -maxdepth 4 -type f | sort

      # 6. Tìm Android project
      - name: Find Android project
        shell: bash
        run: |
          echo "🔎 Đang tìm settings.gradle.kts / settings.gradle..."

          SETTINGS_FILE=$(find android_source -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ Không tìm thấy settings.gradle hoặc settings.gradle.kts"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          echo "✅ Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 7. Kiểm tra project
      - name: Check Android project
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          echo "📂 Project:"
          pwd

          echo "📄 Files:"
          find . -maxdepth 3 -type f | sort

          echo ""
          echo "📄 build.gradle.kts:"
          cat build.gradle.kts

          echo ""
          echo "📄 app/build.gradle.kts:"
          cat app/build.gradle.kts

      # 8. Build APK
      - name: Build Debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          gradle assembleDebug --stacktrace

      # 9. Kiểm tra APK
      - name: Find APK
        shell: bash
        run: |
          echo "🔎 APK đã tạo:"

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "❌ Không tìm thấy APK"
            exit 1
          fi

          echo "✅ APK: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # 10. Đưa APK lên Artifacts
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GiaoHangPro-debug
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
