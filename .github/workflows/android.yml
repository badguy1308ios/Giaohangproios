name: Build Android APK
run-name: "GiaoHangPro v1.0.${{ github.run_number }} • ${{ github.event_name }}"
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: "Build v1.0.${{ github.run_number }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean and repair app UI
        run: |
          python3 tools/cleanup_money_ledger_duplicates_20260911.py
          python3 tools/fix_money_ledger_inputs_20260911.py || true
          python3 tools/fix_header_and_money_compile_20260911.py
          python3 tools/fix_money_cursor_bank_fee_cod_20260911.py
          python3 tools/fix_back_and_order_customer_20260911.py
          python3 tools/add_safe_customer_import_20260912.py
          python3 tools/integrate_vtman_export_20260912.py
          python3 tools/fix_vtman_import_customer_conflict_20260912.py
          python3 tools/add_csv_and_order_tools_20260912.py
          python3 tools/fix_vtman_scan_copy_20260912.py
          python3 tools/add_vtman_clear_queue_20260912.py
          python3 tools/update_vtman_layout_20260912.py
          python3 tools/finalize_vtman_ui_scanner_20260912.py
          python3 tools/add_customer_backup_import_export_20260912.py
          python3 tools/add_order_bulk_route_tools_20260912.py
          python3 tools/fix_order_csv_compile_20260912.py
          python3 tools/move_route_menu_to_sheet_arrow_20260913.py
          python3 tools/improve_map_stt_edit_focus_20260913.py
          python3 tools/add_cross_tab_order_map_nav_20260913.py
          python3 tools/add_order_info_popup_20260913.py
          python3 tools/add_main_tab_swipe_20260913.py
          python3 tools/fix_customer_picker_focus_20260913.py
          python3 tools/add_direct_stt_inline_edit_20260913.py
          python3 tools/group_customer_orders_actions_20260913.py
          python3 tools/fix_grouped_actions_compile_20260913.py
          python3 tools/apply_approved_grouped_order_ui_20260913.py
          python3 tools/restore_order_tab_features_20260913.py
          python3 tools/add_anchor_route_learning_20260913.py
          python3 tools/fix_anchor_settings_scope_20260913.py
          python3 tools/fix_route_viewmodel_methods_20260913.py
          python3 tools/keep_map_alive_remove_tab_swipe_20260913.py
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/example/giaohangpro/MainActivity.kt app/src/main/AndroidManifest.xml app/src/main/res/xml/vtman_accessibility_service.xml
            git commit -m "Apply final app tools [skip ci]"
            git push origin HEAD:main
          fi
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare version
        id: version
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          APK_NAME="GiaoHangPro-v${VERSION}.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_ENV"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_OUTPUT"
      - name: Use persistent debug signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ -f app/keystore/giaohangpro-debug.keystore ]; then
            cp app/keystore/giaohangpro-debug.keystore "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
          fi
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}"
      - uses: actions/upload-artifact@v4
        with:
          name: "GiaoHangPro-v${{ steps.version.outputs.version }}"
          path: "dist/${{ steps.version.outputs.apk_name }}"
          if-no-files-found: error
          retention-days: 30
