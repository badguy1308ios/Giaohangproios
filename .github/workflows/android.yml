name: Build Android APK
run-name: "GiaoHangPro v1.0.${{ github.run_number }} • ${{ github.event_name }}"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "Build v1.0.${{ github.run_number }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply compact order and customer UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/example/giaohangpro/MainActivity.kt')
          s = p.read_text()

          def patch_section(text, start, end, replacements):
              a = text.find(start)
              if a < 0:
                  return text
              b = text.find(end, a + len(start))
              if b < 0:
                  return text
              part = text[a:b]
              for old, new in replacements:
                  part = part.replace(old, new)
              return text[:a] + part + text[b:]

          # Tab Chi tiết đơn: gọn chữ, icon, tag và hàng nút.
          s = patch_section(s, '@Composable\nfun OrderCard', '@Composable\nfun OrderInfoRow', [
              ('Column(Modifier.padding(12.dp))', 'Column(Modifier.padding(9.dp))'),
              ('Spacer(Modifier.width(12.dp))', 'Spacer(Modifier.width(8.dp))'),
              ('fontSize = 19.sp', 'fontSize = 17.sp'),
              ('fontSize = 18.sp', 'fontSize = 15.sp'),
              ('Spacer(Modifier.height(7.dp))', 'Spacer(Modifier.height(4.dp))'),
              ('Spacer(Modifier.height(9.dp))', 'Spacer(Modifier.height(6.dp))'),
          ])
          s = patch_section(s, '@Composable\nfun OrderInfoRow', '@Composable\nfun Tag', [
              ('modifier = Modifier.size(27.dp)', 'modifier = Modifier.size(20.dp)'),
              ('Spacer(Modifier.width(10.dp))', 'Spacer(Modifier.width(7.dp))'),
              ('fontSize = 16.sp', 'fontSize = 14.sp'),
              ('.padding(vertical = 2.dp)', '.padding(vertical = 1.dp)'),
          ])
          s = patch_section(s, '@Composable\nfun Tag', '@Composable\nfun RowScope.ActionButton', [
              ('.padding(horizontal = 14.dp, vertical = 6.dp)', '.padding(horizontal = 10.dp, vertical = 4.dp)'),
              ('fontSize = 14.sp', 'fontSize = 12.sp'),
          ])
          s = patch_section(s, '@Composable\nfun RowScope.ActionButton', '// ================================================================\n// 7. TAB KHÁCH HÀNG', [
              ('.height(48.dp)', '.height(40.dp)'),
              ('RoundedCornerShape(14.dp)', 'RoundedCornerShape(12.dp)'),
              ('modifier = Modifier.size(23.dp)', 'modifier = Modifier.size(18.dp)'),
              ('Spacer(Modifier.width(6.dp))', 'Spacer(Modifier.width(4.dp))'),
              ('fontSize = 14.sp', 'fontSize = 12.sp'),
          ])

          # Tab Khách hàng: thu gọn card, avatar, chữ và 4 nút thao tác.
          s = patch_section(s, '@Composable\nfun CustomerListScreen', '@Composable\nprivate fun CustomerSearchBox', [
              ('start = 24.dp', 'start = 16.dp'),
              ('end = 24.dp', 'end = 16.dp'),
              ('top = 18.dp', 'top = 10.dp'),
              ('bottom = 92.dp', 'bottom = 68.dp'),
              ('Arrangement.spacedBy(10.dp)', 'Arrangement.spacedBy(7.dp)'),
              ('.padding(start = 36.dp, bottom = 18.dp)', '.padding(start = 22.dp, bottom = 10.dp)'),
          ])
          s = patch_section(s, '@Composable\nprivate fun CustomerSearchBox', '@Composable\nfun CustomerCard', [
              ('.padding(horizontal = 26.dp, vertical = 18.dp)', '.padding(horizontal = 18.dp, vertical = 10.dp)'),
              ('.heightIn(min = 66.dp)', '.heightIn(min = 52.dp)'),
              ('fontSize = 18.sp', 'fontSize = 15.sp'),
              ('modifier = Modifier.size(32.dp)', 'modifier = Modifier.size(24.dp)'),
              ('modifier = Modifier.size(30.dp)', 'modifier = Modifier.size(22.dp)'),
              ('RoundedCornerShape(18.dp)', 'RoundedCornerShape(15.dp)'),
          ])
          s = patch_section(s, '@Composable\nfun CustomerCard', '@Composable\nprivate fun CustomerAvatar', [
              ('.height(172.dp)', '.height(136.dp)'),
              ('.padding(horizontal = 18.dp, vertical = 11.dp)', '.padding(horizontal = 12.dp, vertical = 8.dp)'),
              ('Spacer(Modifier.width(22.dp))', 'Spacer(Modifier.width(12.dp))'),
              ('fontSize = 21.sp', 'fontSize = 17.sp'),
              ('Spacer(Modifier.height(7.dp))', 'Spacer(Modifier.height(3.dp))'),
              ('fontSize = 18.sp', 'fontSize = 15.sp'),
              ('modifier = Modifier.size(34.dp)', 'modifier = Modifier.size(24.dp)'),
          ])
          s = patch_section(s, '@Composable\nprivate fun CustomerAvatar', '@Composable\nprivate fun CustomerQuickActions', [
              ('.size(78.dp)', '.size(56.dp)'),
              ('modifier = Modifier.size(44.dp)', 'modifier = Modifier.size(30.dp)'),
              ('fontSize = 28.sp', 'fontSize = 20.sp'),
          ])
          s = patch_section(s, '@Composable\nprivate fun CustomerQuickActions', '@Composable\nprivate fun CustomerActionButton', [
              ('Arrangement.spacedBy(10.dp)', 'Arrangement.spacedBy(6.dp)'),
          ])
          s = patch_section(s, '@Composable\nprivate fun CustomerActionButton', '@Composable\nprivate fun CustomerAddButton', [
              ('.height(58.dp)', '.height(42.dp)'),
              ('RoundedCornerShape(18.dp)', 'RoundedCornerShape(14.dp)'),
              ('.padding(horizontal = 8.dp)', '.padding(horizontal = 5.dp)'),
              ('.size(40.dp)', '.size(28.dp)'),
              ('fontSize = if (iconText == "Zalo") 11.sp else 10.sp', 'fontSize = if (iconText == "Zalo") 9.sp else 8.sp'),
              ('modifier = Modifier.size(23.dp)', 'modifier = Modifier.size(16.dp)'),
              ('Spacer(Modifier.width(8.dp))', 'Spacer(Modifier.width(4.dp))'),
              ('fontSize = if (label == "Dẫn đường") 15.sp else 16.sp', 'fontSize = 12.sp'),
          ])
          s = patch_section(s, '@Composable\nprivate fun CustomerAddButton', '// ================================================================\n// 8. CHI TIẾT KHÁCH HÀNG', [
              ('.size(76.dp)', '.size(56.dp)'),
              ('modifier = Modifier.size(46.dp)', 'modifier = Modifier.size(34.dp)'),
          ])

          p.write_text(s)
          PY

      - name: Save UI changes to source
        shell: bash
        run: |
          if git diff --quiet; then
            echo "UI source already compact"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/example/giaohangpro/MainActivity.kt
            git commit -m "Compact order and customer tab UI [skip ci]"
            git push origin HEAD:main
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Use persistent debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          cp app/keystore/giaohangpro-debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Prepare version
        id: version
        shell: bash
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          APK_NAME="GiaoHangPro-v${VERSION}.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: "GiaoHangPro-v${{ steps.version.outputs.version }}"
          path: "dist/${{ steps.version.outputs.apk_name }}"
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "## GiaoHangPro v${APP_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: #${GITHUB_RUN_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: \`${APK_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- UI: compact order tab + compact customer tab" >> "$GITHUB_STEP_SUMMARY"
          echo "- Signing: persistent debug key for install-over updates" >> "$GITHUB_STEP_SUMMARY"
