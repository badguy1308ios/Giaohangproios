// Tạo Drawable marker kiểu bong bóng'''
          s = re.sub(row_pattern, row_new, s, count=1, flags=re.S)

          # 5) Icon tài xế dạng xe máy.
          if 'createDriverMotorbikeBitmap' not in s:
              anchor = 'return android.graphics.drawable.BitmapDrawable(context.resources, bitmap) // Trả về Drawable cho OSMDroid Marker.icon.\n}\n\n\n// ================================================================\n// 5. TAB BẢN ĐỒ'
              helper = '''return android.graphics.drawable.BitmapDrawable(context.resources, bitmap) // Trả về Drawable cho OSMDroid Marker.icon.
}

private fun createDriverMotorbikeBitmap(context: android.content.Context): android.graphics.Bitmap {
    val density = context.resources.displayMetrics.density
    val size = (34 * density).toInt()
    val bitmap = android.graphics.Bitmap.createBitmap(size, size, android.graphics.Bitmap.Config.ARGB_8888)
    val canvas = android.graphics.Canvas(bitmap)
    val paint = android.graphics.Paint(android.graphics.Paint.ANTI_ALIAS_FLAG)
    paint.color = android.graphics.Color.rgb(22, 141, 226)
    canvas.drawCircle(size / 2f, size / 2f, size * 0.48f, paint)
    paint.color = android.graphics.Color.WHITE
    paint.textSize = 19 * density
    paint.textAlign = android.graphics.Paint.Align.CENTER
    val y = size / 2f - (paint.ascent() + paint.descent()) / 2f
    canvas.drawText("🛵", size / 2f, y, paint)
    return bitmap
}


