name: Build Android APK
run-name: "GiaoHangPro v1.0.${{ github.run_number }} • ${{ github.event_name }}"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "Build v1.0.${{ github.run_number }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested compact UI and QR scanner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/example/giaohangpro/MainActivity.kt')
          s = p.read_text()

          def section(text, start, end, reps):
              a = text.find(start)
              if a < 0: return text
              b = text.find(end, a + len(start))
              if b < 0: return text
              part = text[a:b]
              for old,new in reps:
                  part = part.replace(old,new)
              return text[:a] + part + text[b:]

          # Màu chủ đạo: cam đất + xám trắng, loại bỏ xanh khỏi UI.
          s = s.replace('private val Orange = Color(0xFFE34B0A)', 'private val Orange = Color(0xFFC65A22)')
          s = s.replace('private val OrangeDark = Color(0xFFC94209)', 'private val OrangeDark = Color(0xFFA94318)')
          s = s.replace('private val OrangeLight = Color(0xFFFFEEE7)', 'private val OrangeLight = Color(0xFFFFF3EC)')
          s = s.replace('private val Blue = Color(0xFF168DE2)', 'private val Blue = Orange')
          s = s.replace('private val Navy = Color(0xFF09295A)', 'private val Navy = Color(0xFF3E3A37)')
          s = s.replace('private val TextGray = Color(0xFF657894)', 'private val TextGray = Color(0xFF77716C)')
          s = s.replace('private val Background = Color(0xFFF4F8FC)', 'private val Background = Color(0xFFF6F4F1)')
          s = s.replace('private val Border = Color(0xFFD7E2EF)', 'private val Border = Color(0xFFDDD8D2)')
          s = s.replace('Color(0xFFE1EAF6)', 'Color(0xFFEDE9E4)')
          s = s.replace('Color(0xFF168DE2)', 'Orange')

          # ZXing QR imports.
          if 'com.journeyapps.barcodescanner.ScanContract' not in s:
              s = s.replace('import org.json.JSONObject\n', 'import org.json.JSONObject\nimport com.journeyapps.barcodescanner.ScanContract\nimport com.journeyapps.barcodescanner.ScanOptions\n')

          # TAB CHI TIẾT ĐƠN: QR lồng trong ô tìm kiếm, lọc tức thì, padding sát lề.
          pat = r'@Composable\nfun OrderListScreen\(orders: List<Order>\) \{.*?\n\}\n\n@Composable\nfun OrderCard'
          repl = '''@Composable
fun OrderListScreen(orders: List<Order>) {
    var keyword by remember { mutableStateOf("") }
    val scanLauncher = rememberLauncherForActivityResult(ScanContract()) { result ->
        result.contents?.trim()?.takeIf { it.isNotEmpty() }?.let { keyword = it }
    }
    val filteredOrders = remember(orders, keyword) {
        val q = keyword.trim()
        if (q.isBlank()) orders else orders.filter {
            it.code.contains(q, true) || it.customer.contains(q, true) ||
                it.phone.contains(q, true) || it.address.contains(q, true)
        }
    }

    Column(Modifier.fillMaxSize()) {
        TopHeader()
        Column(Modifier.fillMaxSize().padding(horizontal = 6.dp)) {
            Spacer(Modifier.height(6.dp))
            SearchBox(
                value = keyword,
                onValueChange = { keyword = it },
                onClear = { keyword = "" },
                onQrClick = {
                    scanLauncher.launch(ScanOptions().apply {
                        setDesiredBarcodeFormats(ScanOptions.QR_CODE)
                        setPrompt("Đưa mã QR vào giữa khung")
                        setBeepEnabled(false)
                        setOrientationLocked(false)
                        setBarcodeImageEnabled(false)
                    })
                }
            )
            Spacer(Modifier.height(6.dp))
            Text("Tổng số: ${filteredOrders.size} đơn", color = Navy, fontSize = 20.sp, fontWeight = FontWeight.Bold)
            Spacer(Modifier.height(6.dp))
            LazyColumn(
                verticalArrangement = Arrangement.spacedBy(6.dp),
                contentPadding = PaddingValues(bottom = 8.dp)
            ) {
                itemsIndexed(filteredOrders) { index, order -> OrderCard(index + 1, order) }
            }
        }
    }
}

