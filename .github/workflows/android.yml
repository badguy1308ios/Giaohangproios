name: Build Android APK
run-name: "GiaoHangPro v1.0.${{ github.run_number }} • ${{ github.event_name }}"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "Build v1.0.${{ github.run_number }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested map UI update
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/example/giaohangpro/MainActivity.kt')
          s = p.read_text()

          def rep(old, new, count=1):
              global s
              if old in s:
                  s = s.replace(old, new, count)

          # 1) Giữ toàn bộ app trong vùng an toàn, không đè status/navigation bar.
          rep('''            GiaoHangProTheme {
                GiaoHangApp()
            }''', '''            GiaoHangProTheme {
                Box(
                    Modifier
                        .fillMaxSize()
                        .windowInsetsPadding(WindowInsets.safeDrawing)
