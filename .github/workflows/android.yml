      - name: Save app source changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Source already updated"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/example/giaohangpro/MainActivity.kt
            git commit -m "Compact earth-orange UI and QR scanning [skip ci]"
            git push origin HEAD:main
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Use persistent debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          cp app/keystore/giaohangpro-debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Prepare version
        id: version
        shell: bash
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          APK_NAME="GiaoHangPro-v${VERSION}.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: "GiaoHangPro-v${{ steps.version.outputs.version }}"
          path: "dist/${{ steps.version.outputs.apk_name }}"
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        run: |
          echo "## GiaoHangPro v${APP_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Earth-orange + off-white compact UI" >> "$GITHUB_STEP_SUMMARY"
          echo "- QR scanner integrated into order search" >> "$GITHUB_STEP_SUMMARY"
          echo "- Persistent signing for install-over updates" >> "$GITHUB_STEP_SUMMARY"
