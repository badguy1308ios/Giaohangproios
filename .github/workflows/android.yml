name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find ZIP
        run: |
          echo "=== FILES ==="
          find . -maxdepth 3 -type f

          ZIP_FILE=$(find . -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Khong tim thay file ZIP"
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract ZIP
        run: |
          rm -rf android_source
          mkdir android_source

          unzip -q "$ZIP_FILE" -d android_source

          echo "=== SOURCE ==="
          find android_source -maxdepth 5 -type f

      - name: Find Android Project
        run: |
          SETTINGS=$(find android_source -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Khong tim thay settings.gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android Project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Show Project
        run: |
          echo "=== PROJECT ==="
          pwd
          echo "$PROJECT_DIR"

          echo "=== FILES ==="
          find "$PROJECT_DIR" -maxdepth 4 -type f

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"

          echo "=== BUILD ==="

          gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "=== APK ==="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk"

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Khong tao duoc APK"
            exit 1
          fi

          echo "APK FOUND: $APK"
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GiaoHangPro-debug
          path: ${{ env.APK_PATH }}
