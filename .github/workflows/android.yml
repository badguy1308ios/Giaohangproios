}

// Bottom sheet dạng danh sách đơn hàng'''
          s = re.sub(map_screen, map_screen_new, s, count=1, flags=re.S)

          # 3) Giới hạn bottom sheet khoảng 3 đơn, nhiều hơn thì cuộn.
          rep('.heightIn(min = 185.dp, max = 300.dp)', '.heightIn(min = 185.dp, max = 250.dp)')

          # 4) Nút dẫn đường đúng 24dp như bong bóng STT, tránh IconButton ép tối thiểu 48dp.
          row_pattern = r'''// Một dòng đơn hàng trong danh sách tab Bản đồ\.\n@Composable\nprivate fun MapOrderListRow\(.*?\n\}\n\n// Tạo Drawable marker kiểu bong bóng'''
          row_new = '''// Một dòng đơn hàng trong danh sách tab Bản đồ.
@Composable
private fun MapOrderListRow(
    marker: MapOrderMarker,
    selected: Boolean,
    onClick: () -> Unit,
    onNavigate: () -> Unit
) {
    val order = marker.order
    Card(
        modifier = Modifier
