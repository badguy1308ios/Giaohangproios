name: Build Android APK
run-name: "GiaoHangPro v1.0.${{ github.run_number }} • ${{ github.event_name }}"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "Build v1.0.${{ github.run_number }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Use persistent debug signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          cp app/keystore/giaohangpro-debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Prepare version
        id: version
        shell: bash
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          APK_NAME="GiaoHangPro-v${VERSION}.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: "GiaoHangPro-v${{ steps.version.outputs.version }}"
          path: "dist/${{ steps.version.outputs.apk_name }}"
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "## GiaoHangPro v${APP_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Smooth tab switching" >> "$GITHUB_STEP_SUMMARY"
          echo "- Compact map/order UI + green amount" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reworked customer detail and multi-value editor" >> "$GITHUB_STEP_SUMMARY"
          echo "- Safe coordinate picker focused on user position" >> "$GITHUB_STEP_SUMMARY"
