name: Build Android APK
run-name: "GiaoHangPro v1.0.${{ github.run_number }} • ${{ github.event_name }}"

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: "Build v1.0.${{ github.run_number }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply map UI changes
        shell: bash
        run: echo '' | base64 -d | python3

      - name: Commit app source update
        shell: bash
        run: |
          if git diff --quiet; then
            echo "App source already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app/src/main/java/com/example/giaohangpro/MainActivity.kt
            git commit -m "Improve map controls, markers and safe insets"
            git push origin HEAD:main
          fi

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare version
        id: version
        shell: bash
        run: |
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          APK_NAME="GiaoHangPro-v${VERSION}.apk"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: "GiaoHangPro-v${{ steps.version.outputs.version }}"
          path: "dist/${{ steps.version.outputs.apk_name }}"
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        if: always()
        shell: bash
        run: |
          echo "## GiaoHangPro v${APP_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build: #${GITHUB_RUN_NUMBER}" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: \`${APK_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- UI: safe insets + numbered markers + map controls + motorbike driver marker" >> "$GITHUB_STEP_SUMMARY"
